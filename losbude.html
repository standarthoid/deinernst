<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Losbude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#FFF8E7;
    --ink:#000000;
    --muted:#5B5346;
    --surface:#FFFFFF;
    --surface-cream:#FFF8E7;
    --pink:#FF1493;
    --gold:#FFD700;
    --orange:#FFA500;
    --purple:#8B4789;
    --green:#2D8B57;
    --shadow: rgba(0,0,0,0.3);
    --line-thin:2px;
    --line-med:3px;
    --line:4px;
    --line-thick:5px;
    --font-display:"Arial Black","Arial Bold",Arial,sans-serif;
    --font-body:Arial, Helvetica, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  /* Deliberately single-theme: a comic-zine identity (black ink on cream paper)
     modeled on podcastdeinernst.de, which itself has no dark variant. */

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
  }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  h1,h2{ font-family:var(--font-display); text-wrap:balance; margin:0; }

  .block{ width:100%; position:relative; }
  .block-inner{ max-width:980px; margin:0 auto; padding:2.75rem 1.25rem; }
  .block--cream{ background:var(--surface-cream); }
  .block--purple{
    background-color:var(--purple);
    background-image:radial-gradient(circle, rgba(255,255,255,0.16) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    color:#FFF8E7;
  }
  .block--gold{
    background-color:var(--gold);
    background-image:radial-gradient(circle, rgba(0,0,0,0.09) 1.5px, transparent 1.5px), linear-gradient(135deg, var(--gold), var(--orange));
    background-size:22px 22px, auto;
  }
  .block + .block{ border-top:var(--line-thick) solid var(--ink); }

  /* ---------- header ---------- */
  header.top{
    background:var(--surface-cream);
    border-bottom:var(--line-thick) solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  header .block-inner{
    padding:2rem 1.25rem 1.75rem;
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:0.75rem 1.5rem;
  }
  h1.wordmark{
    font-size:2.4rem;
    text-transform:uppercase;
    letter-spacing:-0.01em;
  }
  header p.tagline{
    margin:0.4rem 0 0;
    color:var(--muted);
    font-size:0.95rem;
    max-width:44ch;
  }
  .star{
    position:absolute;
    color:var(--pink);
    font-size:1.6rem;
    line-height:1;
    transform:rotate(12deg);
  }
  .star--1{ top:1.1rem; right:6.5rem; }
  .star--2{ bottom:0.6rem; right:1.3rem; font-size:1.1rem; transform:rotate(-10deg); }
  .stat-badge{
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:var(--ink);
    background:var(--surface);
    border:var(--line-med) solid var(--ink);
    border-radius:14px;
    padding:0.5rem 0.85rem;
    box-shadow:3px 3px 0 var(--shadow);
    white-space:nowrap;
  }
  .stat-badge b{ font-weight:700; }

  section{ margin:0; }
  .section-head{
    display:inline-block;
    background:var(--gold);
    color:var(--ink);
    border:var(--line) solid var(--ink);
    box-shadow:6px 6px 0 var(--shadow);
    padding:0.5rem 1.4rem;
    text-transform:uppercase;
    font-size:1.15rem;
    margin-bottom:1.4rem;
  }
  .section-head--onlight{ background:var(--surface); }
  .section-head--pink{ background:var(--pink); color:#fff; }
  .hint{
    display:block;
    font-family:var(--font-body);
    text-transform:none;
    font-size:0.78rem;
    font-weight:400;
    color:var(--muted);
    margin-top:0.2rem;
  }
  .section-head--pink .hint{ color:#FFE1F0; }

  /* ---------- Spiele (saved games) ---------- */
  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:1.1rem;
  }
  .game-card{
    background:var(--surface);
    color:var(--ink);
    border:var(--line) solid var(--ink);
    border-radius:16px;
    box-shadow:8px 8px 0 var(--shadow);
    padding:1rem 1.1rem;
    cursor:pointer;
    position:relative;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .game-card:hover{ transform:translate(-2px,-2px); box-shadow:10px 10px 0 var(--shadow); }
  .game-card--active{
    cursor:default;
    border-color:var(--pink);
    box-shadow:8px 8px 0 var(--pink);
  }
  .game-card--active:hover{ transform:none; box-shadow:8px 8px 0 var(--pink); }
  .game-active-badge{
    position:absolute;
    top:-0.65rem; right:0.8rem;
    background:var(--pink);
    color:#fff;
    font-family:var(--font-display);
    font-size:0.62rem;
    letter-spacing:0.04em;
    border:var(--line-med) solid var(--ink);
    border-radius:20px;
    padding:0.2rem 0.6rem;
    box-shadow:3px 3px 0 var(--shadow);
  }
  .game-name{
    font-family:var(--font-display);
    font-size:1.05rem;
    text-transform:uppercase;
    padding-right:0.5rem;
    -webkit-hyphens:auto;
    hyphens:auto;
    overflow-wrap:break-word;
  }
  .game-meta{ font-size:0.76rem; color:var(--muted); margin-top:0.35rem; }
  .game-actions{
    margin-top:0.75rem;
    display:flex;
    align-items:center;
    gap:0.9rem;
  }
  .game-card.is-empty{
    background:transparent;
    box-shadow:none;
    border-style:dashed;
    color:#F3E9D0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:0.3rem;
    min-height:96px;
  }
  .game-card.is-empty span{ font-size:1.8rem; line-height:1; }
  .game-card.is-empty:hover{ transform:none; border-color:#FFF8E7; color:#FFF8E7; }

  /* ---------- buttons ---------- */
  .btn-primary, .btn-secondary{
    font-family:var(--font-display);
    text-transform:uppercase;
    border:var(--line) solid var(--ink);
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-primary{
    background:var(--pink);
    color:#fff;
    font-size:1.05rem;
    padding:0.95rem 2.1rem;
    box-shadow:6px 6px 0 var(--shadow);
  }
  .btn-primary:hover:not(:disabled){ transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--shadow); }
  .btn-primary:active:not(:disabled){ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow); }
  .btn-primary:disabled{
    background:#EDE4CC;
    color:var(--muted);
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:#fff;
    color:var(--ink);
    font-size:0.78rem;
    padding:0.4rem 0.9rem;
    box-shadow:3px 3px 0 var(--shadow);
    border-width:var(--line-med);
  }
  .btn-secondary:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow); }

  .icon-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:1.15rem;
    line-height:1;
    cursor:pointer;
    padding:0.2rem 0.35rem;
    border-radius:6px;
  }
  .icon-btn:hover{ background:#F1E8D2; color:var(--pink); }
  .icon-btn.confirm{ color:#fff; background:var(--pink); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--pink);
    outline-offset:2px;
  }

  .link-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.8rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0.2rem;
    font-family:var(--font-body);
  }
  .link-btn:hover{ color:var(--ink); }
  .link-btn.confirm{ color:var(--pink); font-weight:700; }
  .link-btn:disabled{ color:#C9BFA8; text-decoration:none; cursor:not-allowed; }

  /* ---------- Kategorien ---------- */
  .active-game-head{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
    margin-bottom:1.4rem;
    flex-wrap:wrap;
  }
  .active-game-head .eyebrow{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
  }
  .active-game-name{
    font-family:var(--font-display);
    font-size:1.4rem;
    text-transform:uppercase;
    background:transparent;
    border:none;
    border-bottom:var(--line-med) dashed transparent;
    color:var(--ink);
    padding:0.1rem 0.15rem;
    min-width:8ch;
  }
  .active-game-name:hover{ border-bottom-color:#D8CBA8; }
  .active-game-name:focus{ outline:none; border-bottom-color:var(--pink); }

  .share-row{
    display:flex;
    align-items:center;
    gap:0.9rem;
    flex-wrap:wrap;
    margin-bottom:0.8rem;
  }
  .share-status{ font-size:0.78rem; color:var(--muted); }
  .share-box{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:10px;
    padding:0.65rem 0.85rem;
    margin-bottom:1.3rem;
    display:flex;
    flex-direction:column;
    gap:0.4rem;
    max-width:32rem;
  }
  .share-label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
  }
  .share-copy-row{ display:flex; gap:0.5rem; }
  .share-link-input{
    flex:1; min-width:0;
    font-family:var(--font-mono);
    font-size:0.78rem;
    padding:0.4rem 0.55rem;
    border-radius:8px;
    border:2px solid var(--ink);
    background:var(--bg);
    color:var(--ink);
  }

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:1.2rem;
  }
  .cat-card{
    background:var(--surface);
    border:var(--line-thick) solid var(--ink);
    border-radius:16px;
    padding:1rem 1.15rem 1.15rem;
    box-shadow:8px 8px 0 var(--shadow);
    display:flex;
    flex-direction:column;
    gap:0.7rem;
  }
  .cat-card-head{ display:flex; align-items:flex-start; gap:0.5rem; }
  .cat-name-input{
    flex:1;
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:1.02rem;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    padding:0.1rem 0.1rem 0.2rem;
    min-width:0;
  }
  .cat-name-input:hover{ border-bottom-color:#D8CBA8; }
  .cat-name-input:focus{ outline:none; border-bottom-color:var(--pink); }

  .counts{ font-size:0.78rem; color:var(--muted); }
  .counts .mono{ color:var(--ink); font-weight:600; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:0.4rem; min-height:1.6rem; }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:0.3rem;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:0.22rem 0.4rem 0.22rem 0.7rem;
    font-size:0.82rem;
  }
  .chip--drawn{
    background:#EFE6D2;
    border-style:dashed;
    color:var(--muted);
    text-decoration:line-through;
  }
  .chip-round{
    font-family:var(--font-mono);
    font-size:0.65rem;
    background:var(--pink);
    color:#fff;
    border-radius:999px;
    padding:0.05rem 0.4rem;
    text-decoration:none;
  }
  .chip-x{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:0.9rem; line-height:1; padding:0.1rem 0.2rem; border-radius:50%;
  }
  .chip-x:hover{ background:#F1E8D2; color:var(--pink); }

  .term-add{ display:flex; gap:0.4rem; }
  .term-add input{
    flex:1; min-width:0;
    font-family:var(--font-body);
    font-size:0.88rem;
    padding:0.5rem 0.65rem;
    border-radius:10px;
    border:2px solid var(--ink);
    background:var(--bg);
    color:var(--ink);
  }
  .term-add input::placeholder{ color:#A79A7C; }
  .term-add button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:0.85rem;
    padding:0.5rem 0.8rem;
    border-radius:10px;
    border:2px solid var(--ink);
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .term-add button:hover{ background:#FFC800; }

  .cat-card.is-empty{
    align-items:center; justify-content:center;
    border-style:dashed; border-color:var(--ink);
    color:var(--muted);
    cursor:pointer;
    background:transparent;
    box-shadow:none;
  }
  .cat-card.is-empty:hover{ background:#FBF2DC; color:var(--ink); }
  .cat-card.is-empty span{ font-size:2rem; line-height:1; }
  .empty-note{ color:var(--muted); font-size:0.88rem; padding:0.9rem 0 0; }

  /* ---------- Ziehung ---------- */
  .stage{ text-align:center; }
  .stage .section-head{ background:#fff; }
  .stage .section-head .hint{ color:var(--muted); }
  .stage-btn-row{ padding:0.5rem 0 0.25rem; }
  .stage-empty{ margin-top:1.4rem; color:#4A4432; font-size:0.9rem; }

  .stage-actions{
    margin-top:1rem;
    display:flex; gap:1.4rem; justify-content:center; flex-wrap:wrap;
  }
  .stage .link-btn{ color:#4A4432; }
  .stage .link-btn:hover{ color:var(--ink); }
  .stage .link-btn.confirm{ color:#7A0030; }

  .reveal-row{
    margin-top:2.2rem;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1.5rem 1.1rem;
    padding:0.5rem 0.5rem 1rem;
  }
  .reveal{
    width:200px;
    background:#fff;
    border:var(--line-thick) solid var(--ink);
    border-radius:18px;
    box-shadow:9px 9px 0 var(--shadow);
    padding:0 0 0.9rem;
    transform:rotate(var(--tilt,0deg));
  }
  .reveal-tag{
    display:inline-block;
    max-width:calc(100% - 1.2rem);
    margin:-0.75rem 0 0.9rem 0.9rem;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:#fff;
    border:var(--line-med) solid var(--ink);
    border-radius:999px;
    padding:0.22rem 0.65rem;
    box-shadow:3px 3px 0 var(--shadow);
    text-align:center;
    -webkit-hyphens:auto;
    hyphens:auto;
    overflow-wrap:break-word;
  }
  .reveal-term{
    font-family:var(--font-display);
    font-size:1.05rem;
    text-transform:uppercase;
    padding:0 0.9rem;
    text-align:center;
    text-wrap:balance;
    -webkit-hyphens:auto;
    hyphens:auto;
    overflow-wrap:break-word;
    line-height:1.2;
    min-height:2.6em;
    display:flex; align-items:center; justify-content:center;
  }
  /* ---------- Verlauf ---------- */
  .history-list{ display:flex; flex-direction:column; gap:0.55rem; }
  .history-row{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:0.4rem 0.7rem;
    padding:0.6rem 0.85rem;
    background:var(--surface);
    border:var(--line-thin) solid var(--ink);
    border-radius:10px;
    box-shadow:2px 2px 0 var(--shadow);
    font-size:0.85rem;
  }
  .history-round{
    font-family:var(--font-mono); font-weight:600; color:var(--pink); white-space:nowrap;
  }
  .history-item{ color:var(--muted); }
  .history-item b{ color:var(--ink); font-weight:700; }
  .history-sep{ color:#C9BFA8; }
  .history-toggle{ margin-top:0.8rem; font-size:0.82rem; }

  footer.foot{
    text-align:center;
    padding:1.4rem 1.25rem 2.2rem;
    font-size:0.78rem;
    color:var(--muted);
    background:var(--surface-cream);
  }
</style>

<div id="app"></div>

<script>
(function(){
  "use strict";
  // Sets the document language so the browser's German hyphenation
  // dictionary kicks in for `hyphens:auto` (works whether this file is
  // wrapped by a preview or served standalone as its own page).
  document.documentElement.lang = "de";

  var STORAGE_KEY = "losbude:v2";
  var LEGACY_KEY = "losbude:v1";
  var pendingFocus = null;
  var confirmArm = { key:null, timeout:null };
  var historyExpanded = false;

  function uid(prefix){
    return prefix + "-" + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
  }

  function freshGame(name){
    return { id: uid("game"), name: name || "Spiel 1", createdAt: Date.now(), updatedAt: Date.now(),
      categories: [], rounds: [], nextRoundNumber: 1 };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.games) && parsed.games.length){
          if(!parsed.games.some(function(g){ return g.id===parsed.activeGameId; })){
            parsed.activeGameId = parsed.games[0].id;
          }
          return parsed;
        }
      }
      // migrate a v1 single-game save, if present
      var legacyRaw = localStorage.getItem(LEGACY_KEY);
      if(legacyRaw){
        var legacy = JSON.parse(legacyRaw);
        if(legacy && Array.isArray(legacy.categories)){
          var migrated = freshGame("Mein Spiel");
          migrated.categories = legacy.categories || [];
          migrated.rounds = legacy.rounds || [];
          migrated.nextRoundNumber = legacy.nextRoundNumber || 1;
          return { games:[migrated], activeGameId: migrated.id };
        }
      }
      return null;
    }catch(e){ return null; }
  }

  var state = loadState();
  if(!state){
    var first = freshGame("Spiel 1");
    state = { games:[first], activeGameId:first.id };
  }

  function activeGame(){
    return state.games.find(function(g){ return g.id===state.activeGameId; });
  }

  function save(){
    var g = activeGame();
    if(g) g.updatedAt = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable */ }
    if(g && g.isSharing && g.shareId) broadcastGame(g);
  }

  // ---------- live sharing (host → viewers, via the free ntfy.sh relay) ----------

  function genShareId(){
    return Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ntfy.sh silently turns a message into a file attachment once the body
  // passes its plain-text size limit (~4KB) — the viewer then gets "you
  // received a file" instead of our JSON and can never show anything. So
  // we broadcast a deliberately compact wire format: short keys, tuples
  // instead of objects for the many small term/result entries (no repeated
  // key names), no internal ids or undo bookkeeping, and capped history —
  // to stay well under that limit even for a long, many-category game.
  // { n:name, c:[{n:name, t:[[text,drawnFlag], ...]}], r:[{no:number, re:[[categoryName,text], ...]}] }
  function buildBroadcastPayload(g){
    return {
      n: g.name,
      c: g.categories.map(function(cat){
        return {
          n: cat.name,
          t: cat.terms.map(function(t){ return [t.text, t.drawn ? 1 : 0]; })
        };
      }),
      r: g.rounds.slice(-5).map(function(round){
        return {
          no: round.number,
          re: round.results.map(function(res){ return [res.categoryName, res.text]; })
        };
      })
    };
  }

  // Broadcasts are fire-and-forget, but several in a row (e.g. quick undo
  // after a draw) could otherwise race over the network and let an older
  // state arrive after a newer one. Chaining them through one promise keeps
  // them in the order they were made, so viewers never flicker backwards.
  var broadcastChain = Promise.resolve();

  function broadcastGame(g){
    try{
      var payload = JSON.stringify(buildBroadcastPayload(g));
      var shareId = g.shareId;
      broadcastChain = broadcastChain.then(function(){
        return fetch("https://ntfy.sh/" + encodeURIComponent(shareId), {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: payload
        }).catch(function(){ /* relay unreachable — local play keeps working regardless */ });
      });
    }catch(e){ /* fetch unavailable */ }
  }

  function toggleSharing(){
    var g = activeGame();
    if(!g) return;
    if(g.isSharing){
      g.isSharing = false;
    } else {
      if(!g.shareId) g.shareId = genShareId();
      g.isSharing = true;
    }
    save();
    render();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function formatWhen(ts){
    var diff = Date.now() - ts;
    var min = Math.floor(diff/60000);
    if(min < 1) return "gerade eben";
    if(min < 60) return "vor " + min + " Min.";
    var h = Math.floor(min/60);
    if(h < 24) return "vor " + h + " Std.";
    var d = Math.floor(h/24);
    if(d < 7) return "vor " + d + (d===1 ? " Tag" : " Tagen");
    return new Date(ts).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
  }

  // ---------- games ----------

  function createGame(){
    var g = freshGame("Spiel " + (state.games.length + 1));
    state.games.push(g);
    state.activeGameId = g.id;
    save();
    pendingFocus = { selector: '.active-game-name', select:true };
    render();
  }

  function loadGame(id){
    if(id === state.activeGameId) return;
    state.activeGameId = id;
    save();
    render();
  }

  function renameActiveGame(name){
    var g = activeGame();
    if(g) g.name = name;
    save();
  }

  function deleteGame(id){
    state.games = state.games.filter(function(g){ return g.id!==id; });
    if(state.games.length===0){
      state.games.push(freshGame("Spiel 1"));
    }
    if(!state.games.some(function(g){ return g.id===state.activeGameId; })){
      state.activeGameId = state.games[0].id;
    }
    save();
    render();

  // ---------- categories & terms (scoped to active game) ----------

  function addCategory(){
    var g = activeGame();
    var cat = { id: uid("cat"), name: "Kategorie " + (g.categories.length + 1), terms: [] };
    g.categories.push(cat);
    save();
    pendingFocus = { selector: '.cat-name-input[data-cat="'+cat.id+'"]', select:true };
    render();
  }

  function renameCategory(id, name){
    var g = activeGame();
    var cat = g.categories.find(function(c){ return c.id===id; });
    if(cat) cat.name = name;
    save();
  }

  function removeCategory(id){
    var g = activeGame();
    g.categories = g.categories.filter(function(c){ return c.id!==id; });
    save();
    render();
  }

  function addTermsBulk(catId, raw){
    var g = activeGame();
    var cat = g.categories.find(function(c){ return c.id===catId; });
    if(!cat || !raw) return;
    var parts = raw.split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var existing = {};
    cat.terms.forEach(function(t){ existing[t.text.toLowerCase()] = true; });
    parts.forEach(function(text){
      var key = text.toLowerCase();
      if(existing[key]) return;
      existing[key] = true;
      cat.terms.push({ id: uid("term"), text: text, drawn:false, roundDrawn:null });
    });
    save();
  }

  function removeTerm(catId, termId){
    var g = activeGame();
    var cat = g.categories.find(function(c){ return c.id===catId; });
    if(!cat) return;
    cat.terms = cat.terms.filter(function(t){ return t.id!==termId; });
    save();
    render();
  }

  function drawRound(){
    var g = activeGame();
    var anyTerms = g.categories.some(function(c){ return c.terms.length>0; });
    if(!anyTerms) return;
    var results = [];
    g.categories.forEach(function(cat){
      if(cat.terms.length===0) return;
      var prevLastTermId = cat.lastTermId || null;
      var pool = cat.terms.filter(function(t){ return !t.drawn; });
      var resetSnapshot = null;
      if(pool.length===0){
        // Smaller categories run out first — start a fresh cycle for just this
        // category so it keeps contributing every round, avoiding an immediate
        // repeat of the term it just gave out.
        resetSnapshot = cat.terms.map(function(t){ return { termId:t.id, drawn:t.drawn, roundDrawn:t.roundDrawn }; });
        cat.terms.forEach(function(t){ t.drawn=false; t.roundDrawn=null; });
        pool = cat.terms.filter(function(t){ return cat.terms.length===1 || t.id!==prevLastTermId; });
        if(pool.length===0) pool = cat.terms.slice();
      }
      var idx = Math.floor(Math.random()*pool.length);
      var term = pool[idx];
      term.drawn = true;
      term.roundDrawn = g.nextRoundNumber;
      cat.lastTermId = term.id;
      results.push({ categoryId:cat.id, categoryName:cat.name, termId:term.id, text:term.text, resetSnapshot:resetSnapshot, prevLastTermId:prevLastTermId });
    });
    g.rounds.push({ number: g.nextRoundNumber, timestamp: Date.now(), results: results });
    g.nextRoundNumber++;
    save();
    render();
  }

  function undoLastRound(){
    var g = activeGame();
    var round = g.rounds.pop();
    if(!round) return;
    round.results.forEach(function(r){
      var cat = g.categories.find(function(c){ return c.id===r.categoryId; });
      if(!cat) return;
      if(r.resetSnapshot){
        // this round auto-started a new cycle for the category — restore
        // every term to exactly how it was right before that happened
        r.resetSnapshot.forEach(function(snap){
          var t = cat.terms.find(function(tt){ return tt.id===snap.termId; });
          if(t){ t.drawn=snap.drawn; t.roundDrawn=snap.roundDrawn; }
        });
      } else if(r.termId){
        var term = cat.terms.find(function(t){ return t.id===r.termId; });
        if(term){ term.drawn=false; term.roundDrawn=null; }
      }
      cat.lastTermId = r.prevLastTermId || null;
    });
    g.nextRoundNumber = Math.max(1, g.nextRoundNumber-1);
    save();
    render();
  }

  function resetDraws(){
    var g = activeGame();
    g.categories.forEach(function(c){
      c.terms.forEach(function(t){ t.drawn=false; t.roundDrawn=null; });
      c.lastTermId = null;
    });
    g.rounds = [];
    g.nextRoundNumber = 1;
    save();
    render();
  }

  function totalRemaining(g){
    var n=0;
    g.categories.forEach(function(c){ c.terms.forEach(function(t){ if(!t.drawn) n++; }); });
    return n;
  }

  function renderStage(g){

    var btnLabel = g.rounds.length===0 ? "Erste Ziehung starten" : "Nächste Ziehung starten";

      '<div class="stage-btn-row"><button type="button" class="btn-primary" data-action="draw-round" '+(anyTerms?'':'disabled')+btnTitle+'>'+btnLabel+'</button></div>';

    if(lastRound){

    } else {
      html += '<p class="stage-empty">Noch keine Ziehung gestartet.</p>';

    var undoDisabled = g.rounds.length===0;

  function renderHistory(g){
    if(g.rounds.length===0) return "";
    var rounds = g.rounds.slice().reverse();
    var shown = historyExpanded ? rounds : rounds.slice(0,5);
    var rows = shown.map(function(round){
      var items = round.results.map(function(r){
        return '<span class="history-item">'+esc(r.categoryName)+': <b>'+esc(r.text)+'</b></span>';
      }).join('<span class="history-sep">·</span>');
      return '<div class="history-row"><span class="history-round">Runde '+round.number+'</span>'+items+'</div>';
    }).join("");

    var toggle = "";
    if(rounds.length>5){

  // ---------- confirm-arm for destructive actions ----------

  function withConfirm(action, id, run){
    var key = action + ":" + (id||"");
    if(confirmArm.key === key){
      clearTimeout(confirmArm.timeout);
      confirmArm = { key:null, timeout:null };
      run();
      return;
    }
    if(confirmArm.timeout) clearTimeout(confirmArm.timeout);
    confirmArm = {
      key: key,
      timeout: setTimeout(function(){ confirmArm = { key:null, timeout:null }; render(); }, 3000)
    };
    render();
  }

  // ---------- Zuschauer-Modus (read-only, driven by ?watch=<id>) ----------

  function runViewerMode(shareId){
    var app = document.getElementById("app");
    var snapshot = null;
    var lastContactAt = 0;
    var startedAt = Date.now();
    var pollFailures = 0;

    function isConnected(){ return lastContactAt>0 && (Date.now()-lastContactAt) < 10000; }
    function isStuck(){ return !snapshot && !isConnected() && (Date.now()-startedAt) > 8000; }

    // Turns the compact wire format (short keys, tuples) back into the
    // {name, categories:[{name,terms:[{text,drawn}]}], rounds:[{number,results:[{categoryName,text}]}]}
    // shape that renderCategoryCardReadOnly / renderReveal / renderHistory expect.
    function expandSnapshot(compact){
      return {
        name: compact.n,
        categories: (compact.c||[]).map(function(cat){
          return {
            name: cat.n,
            terms: (cat.t||[]).map(function(pair){ return { text: pair[0], drawn: !!pair[1] }; })
          };
        }),
        rounds: (compact.r||[]).map(function(round){
          return {
            number: round.no,
            results: (round.re||[]).map(function(pair){ return { categoryName: pair[0], text: pair[1] }; })
          };
        })
      };
    }

    function applyMessage(raw){
      try{
        var data = JSON.parse(raw);
        if(data && Array.isArray(data.c)){
          snapshot = expandSnapshot(data);
          lastContactAt = Date.now();
          renderViewer();
        }
      }catch(e){ /* ignore anything that isn't a Losbude snapshot */ }
    }

    // ntfy delivers an oversized message as a file attachment instead of
    // plain text (message becomes "you received a file …") — if that ever
    // happens despite the slimmed-down payload we send, fetch the real
    // content from the attachment URL rather than silently showing nothing.
    function applyEnvelope(envelope){
      if(!envelope) return;
      if(envelope.attachment && envelope.attachment.url){
        fetch(envelope.attachment.url)
          .then(function(res){ return res.text(); })
          .then(applyMessage)
          .catch(function(){ /* attachment fetch failed — next tick will retry */ });
      } else if(envelope.message){
        applyMessage(envelope.message);
      }
    }

    function renderViewer(){
      var statusText = isConnected() ? "🟢 Live" : "🔴 Verbinde …";
      var header =
        '<header class="top"><div class="block-inner">'+
          '<span class="star star--1">★</span><span class="star star--2">★</span>'+
          '<div><h1 class="wordmark">Losbude</h1><p class="tagline">'+
            (snapshot ? "Zuschauer-Modus — du siehst live mit, was gerade gezogen wird." : "Zuschauer-Modus — warte auf die erste Übertragung …")+
          '</p></div>'+
          '<div class="stat-badge">'+statusText+'</div>'+
        '</div></header>';

        if(!snapshot){
          var msg = isStuck()
            ? 'Keine Verbindung zum Live-Dienst bekommen. Das liegt oft an einem Werbeblocker, Datenschutz-Add-on oder einer Firewall, die Verbindungen zu <span class="mono">ntfy.sh</span> blockiert — probier ggf. ein anderes Netzwerk oder deaktiviere Blocker für diese Seite.'
              + ' <button type="button" class="link-btn" data-action="retry-watch">Erneut versuchen</button>'
            : 'Noch keine Daten empfangen. Diese Seite aktualisiert sich automatisch, sobald der Host etwas teilt.';
          app.innerHTML = header + '<div class="block block--cream"><div class="block-inner"><p class="empty-note">'+msg+'</p></div></div>';
          return;
        }

        var catsBlock = '<div class="block block--cream"><div class="block-inner">'+
          '<h2 class="section-head">'+esc(snapshot.name || "Spiel")+'<span class="hint">Kategorien &amp; Begriffe (nur Ansicht)</span></h2>'+
          '<div class="cat-grid">'+ snapshot.categories.map(renderCategoryCardReadOnly).join("") +'</div></div></div>';

        var lastRound = snapshot.rounds[snapshot.rounds.length-1];
        var stageInner = '<div class="stage"><h2 class="section-head">Ziehung</h2>';
        stageInner += lastRound
          ? '<div class="reveal-row">'+ lastRound.results.map(renderReveal).join("") +'</div>'
          : '<p class="stage-empty">Noch keine Ziehung gestartet.</p>';
        stageInner += '</div>';
        var stageBlock = '<div class="block block--gold"><div class="block-inner">'+stageInner+'</div></div>';

        var historyHtml = renderHistory(snapshot);
        var historyBlock = historyHtml ? '<div class="block block--cream"><div class="block-inner">'+historyHtml+'</div></div>' : '';

        var footer = '<footer class="foot">Losbude · Zuschauer-Modus, nur Ansicht</footer>';

        app.innerHTML = header + catsBlock + stageBlock + historyBlock + footer;
    }

    renderViewer();

    app.addEventListener("click", function(e){
      var histEl = e.target.closest('[data-action="toggle-history"]');
      if(histEl){ historyExpanded = !historyExpanded; renderViewer(); return; }
      var retryEl = e.target.closest('[data-action="retry-watch"]');
      if(retryEl){ pollTick(); }
    });

    // Polling is the reliable baseline — it's a plain HTTPS request, so it
    // gets through most ad-blockers/firewalls that kill long-lived SSE
    // streams. SSE (below) just makes updates feel instant when it works.
    function pollTick(){
      fetch("https://ntfy.sh/" + encodeURIComponent(shareId) + "/json?poll=1&since=2h")
        .then(function(res){
          if(!res.ok) throw new Error("bad status");
          return res.text();
        })
        .then(function(text){
          pollFailures = 0;
          var lines = text.split("\n").filter(Boolean);
          if(lines.length){
            applyEnvelope(JSON.parse(lines[lines.length-1]));
          }
          // reachable — counts as contact even before an attachment fetch resolves
          lastContactAt = Date.now();
          renderViewer();
        })
        .catch(function(){
          pollFailures++;
          renderViewer();
        });
    }
    pollTick();
    setInterval(pollTick, 4000);
    setInterval(renderViewer, 4000); // keeps the status/"stuck" message current between ticks

    try{
      var es = new EventSource("https://ntfy.sh/" + encodeURIComponent(shareId) + "/sse");
      es.onopen = function(){ lastContactAt = Date.now(); renderViewer(); };
      es.addEventListener("message", function(evt){
        try{ applyEnvelope(JSON.parse(evt.data)); }catch(e){ /* ignore malformed envelope */ }
      });
    }catch(e){ /* EventSource unavailable in this browser — polling still covers us */ }
  }

  var watchId = new URLSearchParams(location.search).get("watch");
  if(watchId){
    runViewerMode(watchId);
    return;
  }

  // ---------- event delegation (host / editing mode) ----------

  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var catId = el.getAttribute("data-cat");
    var termId = el.getAttribute("data-term");

    switch(action){
      case "create-game": createGame(); break;
      case "load-game": loadGame(id); break;
      case "delete-game": withConfirm("delete-game", id, function(){ deleteGame(id); }); break;
      case "add-category": addCategory(); break;
      case "remove-category": withConfirm("remove-category", id, function(){ removeCategory(id); }); break;
      case "remove-term": removeTerm(catId, termId); break;
      case "add-term": {
        var input = app.querySelector('input[data-role="term-input"][data-cat="'+catId+'"]');
        if(input && input.value.trim()){
          addTermsBulk(catId, input.value);
          pendingFocus = { selector: 'input[data-role="term-input"][data-cat="'+catId+'"]' };
          render();
        }
        break;
      }
      case "draw-round": drawRound(); break;
      case "undo-round": undoLastRound(); break;
      case "reset-draws": withConfirm("reset-draws", "", resetDraws); break;
      case "toggle-history": historyExpanded = !historyExpanded; render(); break;
      case "toggle-sharing": toggleSharing(); break;
      case "copy-share-link": {
        var linkInput = app.querySelector('[data-role="share-link"]');
        if(linkInput){
          linkInput.select();
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(linkInput.value).catch(function(){ /* selection still lets the user copy manually */ });
          }
        }
        break;
      }
    }
  });

  app.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var role = e.target.getAttribute && e.target.getAttribute("data-role");
    if(role === "term-input"){
      e.preventDefault();
      var catId = e.target.getAttribute("data-cat");
      if(e.target.value.trim()){
        addTermsBulk(catId, e.target.value);
        pendingFocus = { selector: 'input[data-role="term-input"][data-cat="'+catId+'"]' };
        render();
      }
    } else if(role === "catname" || role === "active-game-name"){
      e.target.blur();
    } else if(e.target.matches('[data-action="add-category"], [data-action="create-game"], [data-action="load-game"]')){
      e.target.click();
    }
  });

  app.addEventListener("input", function(e){
    var role = e.target.getAttribute && e.target.getAttribute("data-role");
    if(role === "catname"){
      renameCategory(e.target.getAttribute("data-cat"), e.target.value);
    } else if(role === "active-game-name"){
      renameActiveGame(e.target.value);
    }
  });

  render();
})();
</script>
